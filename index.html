            <path fill="currentColor" stroke="none" d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11.14-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z" />
        </symbol>
        <symbol id="i-pause" viewBox="0 0 24 24">
            <path fill="currentColor" stroke="none" d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" />
        </symbol>
        <symbol id="i-volume" viewBox="0 0 24 24">
            <path d="M11 5 6.5 9H3v6h3.5L11 19z" />
            <path d="M15.5 8.5a5 5 0 0 1 0 7 M18.5 5.5a9 9 0 0 1 0 13" />
        </symbol>
        <symbol id="i-volume-x" viewBox="0 0 24 24">
            <path d="M11 5 6.5 9H3v6h3.5L11 19z" />
            <path d="M16 10l5 4 M21 10l-5 4" />
        </symbol>
        <symbol id="i-volume-low" viewBox="0 0 24 24">
            <path d="M11 5 6.5 9H3v6h3.5L11 19z" />
            <path d="M15.5 8.5a5 5 0 0 1 0 7" />
        </symbol>
        <symbol id="i-skip-back" viewBox="0 0 24 24">
            <path fill="currentColor" stroke="none"
                  d="M19 5.7v12.6a1 1 0 0 1-1.53.85l-9.6-6.3a1 1 0 0 1 0-1.7l9.6-6.3A1 1 0 0 1 19 5.7Z" />
            <path d="M6 5v14" stroke-linecap="round" />
        </symbol>
        <symbol id="i-skip-forward" viewBox="0 0 24 24">
            <path fill="currentColor" stroke="none"
                  d="M5 5.7v12.6a1 1 0 0 0 1.53.85l9.6-6.3a1 1 0 0 0 0-1.7l-9.6-6.3A1 1 0 0 0 5 5.7Z" />
            <path d="M18 5v14" stroke-linecap="round" />
        </symbol>
    </svg>

    <!-- Панель сверху -->
    <div class="menu-bar" role="banner">
        <!-- Содержимое рисует js/menu-bar.js: набор меню зависит от активного окна -->
        <nav class="menu-bar__items" aria-label="App menus">
            <span class="menu-bar__active" id="active-app">Finder</span>
        </nav>
        <div class="datetime" id="datetime" role="timer" aria-live="off"></div>
        <!-- Закрыть окно. Видна только на телефоне, где шапки у окна нет:
             там полоса меню и есть его шапка (см. css/responsive-shell.css). -->
        <button class="menu-bar__close" type="button" aria-label="Close window" hidden></button>
    </div>

    <!-- Рабочий стол -->
    <main class="desktop" id="desktop" role="main" aria-label="Desktop">
        <!-- Ссылка, а не div: краулер по ней доходит до страниц проектов.
             Клик перехватывает desktop.js и открывает окно. -->
        <a class="file folder" href="/projects/" data-type="projects" aria-label="Open Projects folder">
            <div class="file-icon">
                <img src="icons/folder-icon.webp" alt="" aria-hidden="true" class="folder-icon" fetchpriority="high">
            </div>
            <span>Projects</span>
        </a>
        <div class="file folder" data-type="photos" tabindex="0" role="button" aria-label="Open Photos folder">
            <div class="file-icon">
                <img src="icons/folder-icon.webp" alt="" aria-hidden="true" class="folder-icon" fetchpriority="high">
            </div>
            <span>Photos</span>
        </div>
        <a class="file" href="/about/" data-type="text" aria-label="Open Resume">
            <div class="file-icon">
                <img src="icons/icon-text.webp" alt="" aria-hidden="true" class="text-icon" fetchpriority="high">
            </div>
            <span>Resume</span>
        </a>
    </main>

    <!-- Окно — шаблон, клонируется JS на каждое открытое приложение -->
    <template id="window-template">
        <div class="window" role="dialog">
            <div class="window-header">
                <div class="window-controls" role="group" aria-label="Window controls">
                    <button class="window-control close" aria-label="Close window" type="button">
                    </button>
                    <button class="window-control minimize" aria-label="Minimize" type="button" tabindex="-1">
                    </button>
                    <button class="window-control maximize" aria-label="Maximize" type="button" tabindex="-1">
                    </button>
                </div>
                <span class="window-title">Window</span>
            </div>
            <div class="window-content" role="document">
                <!-- Рендер JS для содержимого окна -->
            </div>
            <div class="window-resize-handle n" data-dir="n" aria-hidden="true"></div>
            <div class="window-resize-handle s" data-dir="s" aria-hidden="true"></div>
            <div class="window-resize-handle e" data-dir="e" aria-hidden="true"></div>
            <div class="window-resize-handle w" data-dir="w" aria-hidden="true"></div>
            <div class="window-resize-handle ne" data-dir="ne" aria-hidden="true"></div>
            <div class="window-resize-handle nw" data-dir="nw" aria-hidden="true"></div>
            <div class="window-resize-handle se" data-dir="se" aria-hidden="true"></div>
            <div class="window-resize-handle sw" data-dir="sw" aria-hidden="true"></div>
        </div>
    </template>

    <!-- Dock -->
    <nav class="dock" role="navigation" aria-label="Application dock">
        <button class="dock-item" data-type="explorer" aria-label="Open File Explorer">
            <img src="icons/folder-icon.webp" alt="" aria-hidden="true" class="dock-icon" fetchpriority="high">
            <span class="dock-tooltip">File Explorer</span>
            <span class="dock-indicator" aria-hidden="true"></span>
        </button>
        <button class="dock-item" data-type="console" aria-label="Open Terminal">
            <img src="icons/terminal.svg" alt="" aria-hidden="true" class="dock-icon" fetchpriority="high">
            <span class="dock-tooltip">Terminal</span>
            <span class="dock-indicator" aria-hidden="true"></span>
        </button>
        <button class="dock-item" data-type="calls" aria-label="Open Recent Calls">
            <img src="icons/phone.webp" alt="" aria-hidden="true" class="dock-icon" fetchpriority="high">
            <span class="dock-tooltip">Recent Calls</span>
            <span class="dock-indicator" aria-hidden="true"></span>
        </button>
        <button class="dock-item" data-type="browser" aria-label="Open Browser">
            <img src="icons/browser.svg" alt="" aria-hidden="true" class="dock-icon" fetchpriority="high">
            <span class="dock-tooltip">Browser</span>
            <span class="dock-indicator" aria-hidden="true"></span>
        </button>
        <button class="dock-item" data-type="github" aria-label="Open GitHub">
            <img src="icons/github.webp" alt="" aria-hidden="true" class="dock-icon" fetchpriority="high">
            <span class="dock-tooltip">GitHub</span>
            <span class="dock-indicator" aria-hidden="true"></span>
        </button>
        <button class="dock-item" data-type="telegram" aria-label="Open Telegram">
            <img src="icons/telegram.webp" alt="" aria-hidden="true" class="dock-icon" fetchpriority="high">
            <span class="dock-tooltip">Telegram</span>
            <span class="dock-indicator" aria-hidden="true"></span>
        </button>
        <button class="dock-item" data-type="instagram" aria-label="Open Instagram">
            <img src="icons/instagram.webp" alt="" aria-hidden="true" class="dock-icon" fetchpriority="high">
            <span class="dock-tooltip">Instagram</span>
            <span class="dock-indicator" aria-hidden="true"></span>
        </button>
        <button class="dock-item" data-type="notes" aria-label="Open Notes">
            <img src="icons/notepad.webp" alt="" aria-hidden="true" class="dock-icon" fetchpriority="high">
            <span class="dock-tooltip">Notes</span>
            <span class="dock-indicator" aria-hidden="true"></span>
        </button>
        <button class="dock-item" data-type="trash" aria-label="Open Trash">
            <img src="icons/trash.webp" alt="" aria-hidden="true" class="dock-icon" fetchpriority="high">
            <span class="dock-tooltip">Trash</span>
            <span class="dock-indicator" aria-hidden="true"></span>
        </button>
    </nav>

    <!-- Разметка для поиска: сайт и его автор. Тот же @id автора подставляют
         страницы проектов из scripts/seo-pages.js. -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "WebSite",
                "@id": "https://antawkay.com/#website",
                "url": "https://antawkay.com/",
                "name": "Arman Kungozhanov - Portfolio",
                "alternateName": "Antawkay",
                "description": "My portfolio, built as a desktop operating system in plain JavaScript: draggable windows, a file explorer, a terminal and a browser.",
                "inLanguage": "en",
                "author": { "@id": "https://antawkay.com/#antawq" }
            },
            {
                "@type": "Person",
                "@id": "https://antawkay.com/#antawq",
                "name": "Arman Kungozhanov",
                "alternateName": "Antawkay",
                "jobTitle": "Full-stack developer",
                "url": "https://antawkay.com/",
                "sameAs": [
                    "https://github.com/Antawq",
                    "https://t.me/antawkay"
                ]
            }
        ]
    }
    </script>

    <!-- Скрипты -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
