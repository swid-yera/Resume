name: Update GitHub Data

on:
  schedule:
    - cron: '0 0 * * 0'   # раз в неделю (воскресенье)
  workflow_dispatch:          # ручной запуск

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch GitHub profiles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-data.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/github-data.json
          git diff --staged --quiet || git commit -m "chore: update github-data.json [skip ci]"
          git push
